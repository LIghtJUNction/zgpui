name: Validate zgpui

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to validate (empty uses the selected revision)
        required: false
        type: string
  workflow_call:
    outputs:
      crate_sha256:
        description: SHA256 of the source crate built and tested on each native platform
        value: ${{ jobs.quality.outputs.crate_sha256 }}
    inputs:
      ref:
        description: Exact candidate commit to validate
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Core unit tests
        run: cargo test --locked --lib
      - name: Documentation tests
        run: cargo test --locked --doc
      - name: Host contract example
        run: cargo run --locked --example host

  native:
    needs: quality
    name: Native ${{ matrix.features }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: native
          - os: ubuntu-latest
            features: linux-software
          - os: windows-latest
            features: native
          - os: macos-latest
            features: native
    env:
      CARGO_BUILD_JOBS: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - name: Linux native development packages
        if: runner.os == 'Linux'
        env:
          NATIVE_FEATURES: ${{ matrix.features }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libfreetype6-dev libfontconfig1-dev xvfb xauth xdotool x11-utils fonts-liberation fonts-noto-cjk fonts-noto-color-emoji imagemagick
          if [ "$NATIVE_FEATURES" = native ]; then
            sudo apt-get install -y libgl1-mesa-dev
          fi
      - name: Validate the exact native candidate
        run: python scripts/check_native.py --features ${{ matrix.features }} --window
      - name: Download the source crate built by the quality job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          artifact-ids: ${{ needs.quality.outputs.artifact_id }}
          path: ${{ runner.temp }}/zg-crate
          merge-multiple: true
      - name: Build and test the exact packaged native sources
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.quality.outputs.crate_sha256 }}
          NATIVE_FEATURES: ${{ matrix.features }}
        run: |
          git show "$GITHUB_SHA:scripts/release_package.py" > "$RUNNER_TEMP/release_package.py"
          python "$RUNNER_TEMP/release_package.py" verify --directory "$RUNNER_TEMP/zg-crate" --sha256 "$EXPECTED_SHA256" --features "$NATIVE_FEATURES" --destination "$RUNNER_TEMP/zg-unpacked"
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.features }}
          path: artifacts/native-checks/
          if-no-files-found: warn
          retention-days: 14

  raster:
    name: Headless raster companion on Linux
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - name: Linux font development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfreetype6-dev libfontconfig1-dev fonts-liberation fonts-noto-cjk fonts-noto-color-emoji
      - run: cargo test --locked -p zgpui-raster
      - run: cargo test --locked -p zgpui-raster --no-default-features
      - run: cargo clippy --locked -p zgpui-raster --all-targets -- -D warnings
      - name: Draw without a display connection
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo run --locked -p zgpui-raster --example headless -- target/headless.ppm

  no-std:
    name: Library on ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, x86_64-unknown-none]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo check --locked --lib --target ${{ matrix.target }}

  quality:
    name: Formatting, dependencies and package
    outputs:
      crate_sha256: ${{ steps.package.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Enforce the zero-runtime-dependency default core
        run: |
          python3 -m unittest discover -s scripts -p test_dependency_contract.py
          python3 scripts/check_dependency_contract.py
      - name: Check out the pinned Project Z release projection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LIghtJUNction/project-z
          ref: f1e2243bb0d4f721b617b77d6f19924cd81c8303
          path: artifacts/project-z-release
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitmodules
            /scripts/release_projection.py
            /scripts/cargo_versions.py
      - name: Build the registry source crate from the candidate
        id: package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/zg-driver"
          git show "$GITHUB_SHA:scripts/release_package.py" > "$RUNNER_TEMP/zg-driver/release_package.py"
          python "$RUNNER_TEMP/zg-driver/release_package.py" stage --candidate "$(git rev-parse HEAD)" --project-z artifacts/project-z-release --destination "$RUNNER_TEMP/zg-projection"
      - name: Check package excludes ignored artifacts
        shell: bash
        env:
          PACKAGE_SOURCE: ${{ steps.package.outputs.source }}
          VALIDATED_CRATE: ${{ steps.package.outputs.crate }}
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import os, subprocess, tarfile
          source = Path(os.environ["PACKAGE_SOURCE"])
          fixture = source / "artifacts/package-boundary-fixture/nested"
          fixture.mkdir(parents=True, exist_ok=True)
          for name in ("README.md", "LICENSE"):
              (fixture / name).write_text("Ignored package boundary fixture\n")
          files = set(subprocess.check_output(
              ["cargo", "package", "--locked", "--list"], cwd=source, text=True,
          ).splitlines())
          leaked = sorted(path for path in files if path.startswith(("artifacts/", "raster/")))
          required = {"README.md", "LICENSE", "build.rs", "src/native.rs",
                      "native/zgpui.h", "native/font_linux.h", "native/linux.c", "native/windows.c",
                      "native/macos.m", "native/draw.c", "native/draw_software.c",
                      "scripts/check_x11.py", "scripts/test_software.py", "scripts/test_fonts.py",
                      "scripts/test_software_x11.py",
                      "scripts/check_native.py"}
          with tarfile.open(os.environ["VALIDATED_CRATE"], "r:gz") as archive:
              packed = {"/".join(PurePosixPath(item.name).parts[1:]) for item in archive.getmembers()}
          leaked += sorted(path for path in packed if path.startswith(("artifacts/", "raster/")))
          missing = sorted((required - files) | (required - packed))
          if leaked or missing:
              raise SystemExit(f"Invalid package contents: leaked={leaked}, missing={missing}")
          print("Core and native sources included; ignored artifacts excluded")
          PY
      - run: python3 -m unittest discover -s scripts -p test_materials_report.py
      - name: Verify lock projection and archive checks
        shell: bash
        run: |
          git show "$GITHUB_SHA:scripts/test_release_package.py" > "$RUNNER_TEMP/zg-driver/test_release_package.py"
          python -m unittest discover -s "$RUNNER_TEMP/zg-driver" -p test_release_package.py
      - name: Share the verified crate with native jobs
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zgpui-source-crate-${{ github.run_attempt }}
          path: ${{ steps.package.outputs.crate }}
          if-no-files-found: error
