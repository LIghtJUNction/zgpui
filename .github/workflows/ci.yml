name: Validate zgpui

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or ref to validate (empty uses the selected revision)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Exact candidate commit to validate
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Core unit tests
        run: cargo test --locked --lib
      - name: Documentation tests
        run: cargo test --locked --doc
      - name: Host contract example
        run: cargo run --locked --example host

  native:
    name: Native ${{ matrix.features }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: native
          - os: ubuntu-latest
            features: linux-software
          - os: windows-latest
            features: native
          - os: macos-latest
            features: native
    env:
      CARGO_BUILD_JOBS: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - name: Linux native development packages
        if: runner.os == 'Linux'
        env:
          NATIVE_FEATURES: ${{ matrix.features }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libfreetype6-dev libfontconfig1-dev xvfb xauth xdotool x11-utils fonts-liberation fonts-noto-cjk imagemagick
          if [ "$NATIVE_FEATURES" = native ]; then
            sudo apt-get install -y libgl1-mesa-dev
          fi
      - name: Validate the exact native candidate
        run: python scripts/check_native.py --features ${{ matrix.features }} --window --package
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.features }}
          path: artifacts/native-checks/
          if-no-files-found: warn
          retention-days: 14

  raster:
    name: Headless raster companion on Linux
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - name: Linux font development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfreetype6-dev libfontconfig1-dev fonts-liberation fonts-noto-cjk
      - run: cargo test --locked -p zgpui-raster
      - run: cargo test --locked -p zgpui-raster --no-default-features
      - run: cargo clippy --locked -p zgpui-raster --all-targets -- -D warnings
      - name: Draw without a display connection
        run: env -u DISPLAY -u WAYLAND_DISPLAY cargo run --locked -p zgpui-raster --example headless -- target/headless.ppm

  no-std:
    name: Library on ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, x86_64-unknown-none]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo check --locked --lib --target ${{ matrix.target }}

  quality:
    name: Formatting, dependencies and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Enforce zero Cargo dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"],
              text=True,
          ))
          packages = {package["name"]: package for package in data["packages"]}
          if set(packages) != {"zgpui", "zgpui-raster"}:
              raise SystemExit("Expected the core and source-only raster companion")
          if any(package["dependencies"] for package in packages.values()):
              raise SystemExit("zgpui packages must have zero Cargo dependencies")
          if packages["zgpui-raster"]["publish"] != []:
              raise SystemExit("The raster companion must remain source-only")
          if data["workspace_default_members"] != [packages["zgpui"]["id"]]:
              raise SystemExit("Default workspace commands must select only the core")
          print("Zero Cargo dependencies; source-only companion; core-only defaults")
          PY
      - name: Check package excludes ignored artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          fixture = Path("artifacts/package-boundary-fixture/nested")
          fixture.mkdir(parents=True, exist_ok=True)
          for name in ("README.md", "LICENSE"):
              (fixture / name).write_text("Ignored package boundary fixture\n")
          files = set(subprocess.check_output(
              ["cargo", "package", "--locked", "--list"], text=True,
          ).splitlines())
          leaked = sorted(path for path in files if path.startswith(("artifacts/", "raster/")))
          required = {"README.md", "LICENSE", "build.rs", "src/native.rs",
                      "native/zgpui.h", "native/font_linux.h", "native/linux.c", "native/windows.c",
                      "native/macos.m", "native/draw.c", "native/draw_software.c",
                      "scripts/check_x11.py", "scripts/test_software.py", "scripts/test_fonts.py",
                      "scripts/test_software_x11.py",
                      "scripts/check_native.py"}
          missing = sorted(required - files)
          if leaked or missing:
              raise SystemExit(f"Invalid package contents: leaked={leaked}, missing={missing}")
          print("Core and native sources included; ignored artifacts excluded")
          PY
      - run: python3 -m unittest discover -s scripts -p test_materials_report.py
      - run: cargo package --locked
