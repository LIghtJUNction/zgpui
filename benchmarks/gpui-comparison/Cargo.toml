[package]
name = "zgpui-gpui-comparison"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace]
members = ["."]
exclude = [".cache/zed", ".cache/zed/crates/*"]

[features]
allocation-metrics = []

[dependencies]
zgpui = { path = "../.." }
gpui = { path = ".cache/zed/crates/gpui", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
